<header class="app-header">
  <div class="header-inner">
    <a class="brand" routerLink="/" aria-label="Mero Briksha home">
      <img
        class="brand-logo"
        src="MeroBrikshaLogo.jpeg"
        alt="Mero Briksha"
      />

      <span class="brand-name">
        Mero<span>Briksha</span>
      </span>
    </a>

    <button
      class="mobile-menu-button"
      type="button"
      [attr.aria-expanded]="isMobileMenuOpen"
      aria-controls="main-navigation"
      aria-label="Toggle navigation menu"
      (click)="toggleMobileMenu()"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>

    <nav
      id="main-navigation"
      class="main-navigation"
      [class.mobile-open]="isMobileMenuOpen"
      aria-label="Main navigation"
    >
      <a
        class="nav-link active"
        routerLink="/campaigns"
        (click)="closeMobileMenu()"
      >
        <span class="nav-icon" aria-hidden="true">🌱</span>
        <span>Campaigns</span>
      </a>

      <a
        class="nav-link"
        routerLink="/donations"
        (click)="closeMobileMenu()"
      >
        <span class="nav-icon" aria-hidden="true">♡</span>
        <span>Donations</span>
      </a>

      <a
        class="nav-link"
        routerLink="/reports"
        (click)="closeMobileMenu()"
      >
        <span class="nav-icon" aria-hidden="true">▥</span>
        <span>Reports</span>
      </a>
    </nav>

    <div class="header-actions">
      <button class="icon-button" type="button" aria-label="Search">
        <span aria-hidden="true">⌕</span>
      </button>

      <button
        class="icon-button notification-button"
        type="button"
        aria-label="Notifications"
      >
        <span aria-hidden="true">♧</span>
        <span class="notification-badge">3</span>
      </button>

      <div class="profile-menu">
        <div class="profile-avatar" aria-hidden="true">AS</div>

        <div class="profile-details">
          <strong>Admin User</strong>
          <span>Administrator</span>
        </div>

        <button
          class="profile-chevron"
          type="button"
          aria-label="Open profile menu"
        >
          <span aria-hidden="true">⌄</span>
        </button>
      </div>
    </div>
  </div>
</header>
